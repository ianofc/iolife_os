<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IO LIFE | Sistema Operacional da Vida</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        io: {
                            blue: '#0B1220',      /* Azul Noturno Profundo */
                            lightBlue: '#1E2A4A', /* Azul Nebulosa */
                            gold: '#F5B700',      /* Dourado Suave */
                            goldLight: '#FFD700', /* Dourado Brilhante */
                            surface: '#F8FAFC',   /* Fundo Claro */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .glass-nav {
            background: rgba(11, 18, 32, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">

    <nav class="fixed top-0 w-full glass-nav text-white z-50 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-io-blue to-black border border-io-gold flex items-center justify-center">
                        <span class="text-io-gold font-bold text-xl">IO</span>
                    </div>
                    <span class="font-bold text-xl tracking-tight">IO <span class="text-io-gold">LIFE</span></span>
                </div>

                <div class="hidden md:flex space-x-8">
                    <a href="#" class="text-white hover:text-io-gold transition-colors font-medium">Flow</a>
                    <a href="#" class="text-white hover:text-io-gold transition-colors font-medium">Tribos</a>
                    <a href="#" class="text-white hover:text-io-gold transition-colors font-medium">Marketplace</a>
                    <a href="#" class="text-white hover:text-io-gold transition-colors font-medium">Academy</a>
                </div>

                <div class="flex items-center gap-4">
                    <button class="p-2 text-io-gold hover:bg-white/10 rounded-full">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    </button>
                    <div class="w-10 h-10 rounded-full bg-io-lightBlue border-2 border-io-gold overflow-hidden">
                        <img src="https://via.placeholder.com/150" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-20 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
