{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IO LIFE | Clean</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        io: {
                            brand: '#6200EA',    // O Roxo IO (Substitui o Azul)
                            brandDark: '#3700B3',
                            surface: '#FFFFFF',
                            gold: '#FFD700',
                            text: '#1E293B',     // Slate 800
                            muted: '#64748B',    // Slate 500
                            bg: '#F8FAFC'        // Slate 50
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(98, 0, 234, 0.05)',
                        'glow': '0 0 15px rgba(98, 0, 234, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Ajustes Finos de Layout */
        body { 
            padding-bottom: 130px;
            /* Fundo sutil apenas para dar profundidade, quase branco */
            background-image: radial-gradient(circle at 50% 0%, rgba(98, 0, 234, 0.03) 0%, transparent 40%);
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Pulso Roxo para o botão de ação */
        @keyframes purplePulse {
            0% { box-shadow: 0 0 0 0 rgba(98, 0, 234, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(98, 0, 234, 0); }
            100% { box-shadow: 0 0 0 0 rgba(98, 0, 234, 0); }
        }
        .btn-pulse { animation: purplePulse 2s infinite; }

        .menu-overlay {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
        }
        .menu-overlay.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body class="text-io-text antialiased selection:bg-io-brand selection:text-white">

    <header class="fixed top-4 left-0 right-0 z-40 flex justify-center px-4">
        <div class="glass px-6 py-3 rounded-full flex items-center gap-4 md:gap-8 transform transition-all hover:scale-[1.01] w-full max-w-3xl justify-between border border-gray-100">
            
            <a href="{% url 'home' %}" class="flex items-center gap-2 cursor-pointer">
                <div class="w-8 h-8 rounded-lg bg-io-brand flex items-center justify-center text-white font-extrabold shadow-md shadow-purple-200">IO</div>
                <span class="font-bold text-lg tracking-tight text-io-brand hidden sm:block">LIFE</span>
            </a>

            <div class="hidden md:flex items-center bg-gray-100/80 rounded-full px-4 py-1.5 border border-transparent focus-within:border-io-brand/30 focus-within:bg-white w-64 transition-all focus-within:w-80">
                <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
                <input type="text" placeholder="Buscar..." class="bg-transparent border-none outline-none text-sm ml-2 w-full placeholder-gray-400 text-io-text">
            </div>

            <div class="flex items-center gap-4">
                <a href="{% url 'notifications' %}" class="relative text-gray-400 hover:text-io-brand transition-colors">
                    <i data-lucide="bell" class="w-6 h-6"></i>
                    <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                </a>
                
                <a href="{% url 'profile' %}" class="w-9 h-9 rounded-full p-[2px] bg-gradient-to-tr from-io-brand to-purple-300 cursor-pointer hover:scale-110 transition-transform shadow-sm">
                    {% if user.is_authenticated and user.avatar %}
                        <img src="{{ user.avatar.url }}" class="w-full h-full rounded-full object-cover border-2 border-white">
                    {% else %}
                        <div class="w-full h-full rounded-full bg-gray-100 border-2 border-white flex items-center justify-center text-xs font-bold text-io-brand">
                            {{ user.username|slice:":1"|upper }}
                        </div>
                    {% endif %}
                </a>
            </div>
        </div>
    </header>

    <main class="pt-28 px-4 md:px-8 max-w-5xl mx-auto w-full relative z-10">
        {% block content %}
        {% endblock %}
    </main>

    <div id="big-bang-menu" class="menu-overlay fixed inset-x-4 bottom-32 max-w-sm mx-auto z-50">
        <div class="glass rounded-[2rem] p-6 shadow-2xl border border-white/50">
            <h3 class="text-center font-bold text-gray-800 mb-4 uppercase tracking-widest text-[10px]">Menu IO</h3>
            <div class="grid grid-cols-3 gap-4 text-center">
                <a href="{% url 'home' %}" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-purple-50 rounded-2xl flex items-center justify-center text-io-brand group-hover:bg-io-brand group-hover:text-white transition-all shadow-sm">
                        <i data-lucide="layers" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Flow</span>
                </a>
                
                <a href="{% url 'mylife' %}" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-green-50 rounded-2xl flex items-center justify-center text-green-600 group-hover:bg-green-600 group-hover:text-white transition-all shadow-sm">
                        <i data-lucide="heart" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Saúde</span>
                </a>
                <a href="{% url 'mind' %}" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-all shadow-sm">
                        <i data-lucide="brain" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Mente</span>
                </a>
                <a href="{% url 'diary' %}" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center text-amber-600 group-hover:bg-amber-600 group-hover:text-white transition-all shadow-sm">
                        <i data-lucide="book-open" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Diário</span>
                </a>
                <a href="{% url 'games' %}" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-pink-50 rounded-2xl flex items-center justify-center text-pink-600 group-hover:bg-pink-600 group-hover:text-white transition-all shadow-sm">
                        <i data-lucide="gamepad-2" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Jogos</span>
                </a>
                <a href="{% url 'marketplace' %}" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-rose-50 rounded-2xl flex items-center justify-center text-rose-600 group-hover:bg-rose-600 group-hover:text-white transition-all shadow-sm">
                        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-600">Mercado</span>
                </a>
            </div>
            <button onclick="toggleMenu()" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-full max-w-[360px] sm:max-w-[450px]">
        <nav class="glass px-6 py-4 rounded-[2.5rem] shadow-soft flex items-center justify-between relative z-50 bg-white/90">
            
            <a href="{% url 'home' %}" class="group flex flex-col items-center gap-1">
                <div class="p-2 rounded-xl {% if request.path == '/' %}bg-purple-50 text-io-brand{% else %}text-gray-400 hover:text-io-brand hover:bg-purple-50/50{% endif %} transition-all">
                    <i data-lucide="layers" class="w-6 h-6"></i>
                </div>
            </a>

            <a href="#" class="group flex flex-col items-center gap-1">
                <div class="p-2 rounded-xl text-gray-400 hover:text-io-brand hover:bg-purple-50/50 transition-all">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
            </a>

            <button onclick="toggleMenu()" class="w-16 h-16 -mt-12 bg-gradient-to-br from-[#6200EA] to-[#3700B3] rounded-full flex items-center justify-center text-white shadow-lg hover:scale-105 transition-all duration-300 btn-pulse border-4 border-[#F8FAFC] z-50">
                <i data-lucide="plus" id="menu-icon" class="w-8 h-8 font-bold"></i>
            </button>

            <a href="{% url 'mylife' %}" class="group flex flex-col items-center gap-1">
                <div class="p-2 rounded-xl {% if 'life' in request.path %}bg-purple-50 text-io-brand{% else %}text-gray-400 hover:text-io-brand hover:bg-purple-50/50{% endif %} transition-all">
                    <i data-lucide="compass" class="w-6 h-6"></i>
                </div>
            </a>

            <a href="{% url 'messages' %}" class="group flex flex-col items-center gap-1">
                <div class="p-2 rounded-xl {% if 'messages' in request.path %}bg-purple-50 text-io-brand{% else %}text-gray-400 hover:text-io-brand hover:bg-purple-50/50{% endif %} transition-all">
                    <i data-lucide="message-circle" class="w-6 h-6"></i>
                </div>
            </a>

        </nav>
    </div>

    <script>
        lucide.createIcons();
        
        function toggleMenu() {
            const menu = document.getElementById('big-bang-menu');
            const icon = document.getElementById('menu-icon');
            menu.classList.toggle('open');
            icon.style.transform = menu.classList.contains('open') ? 'rotate(135deg)' : 'rotate(0deg)';
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('big-bang-menu');
            const btn = document.querySelector('button[onclick="toggleMenu()"]');
            
            if (menu.classList.contains('open') && !menu.contains(event.target) && !btn.contains(event.target)) {
                 toggleMenu();
            }
        });
    </script>
</body>
</html>
