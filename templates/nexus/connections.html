{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-4xl mx-auto pt-6 pb-24">
    
    <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4 px-2">
        <div>
            <h1 class="text-2xl font-bold text-io-dark">Conexões</h1>
            <p class="text-slate-500 text-sm">Pessoas que compartilham sua jornada.</p>
        </div>
        
        <div class="flex gap-2 w-full md:w-auto">
            <input type="text" placeholder="Buscar..." class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-1 focus:ring-[#004aad] outline-none">
            <button class="bg-[#004aad] text-white px-4 py-2.5 rounded-xl hover:bg-blue-800 transition-colors">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {% for i in "123456" %}
        <div class="bg-white p-4 rounded-2xl shadow-[0_4px_15px_rgba(0,0,0,0.03)] border border-slate-100 flex items-center gap-4 hover:shadow-md transition-shadow cursor-pointer group">
            <div class="relative">
                <img src="https://i.pravatar.cc/150?img={{ forloop.counter|add:20 }}" class="w-14 h-14 rounded-full object-cover border-2 border-slate-100 group-hover:border-[#004aad] transition-colors">
                {% if forloop.first %}
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
                {% endif %}
            </div>
            
            <div class="flex-1 min-w-0">
                <h3 class="font-bold text-io-dark truncate">Nome da Conexão {{i}}</h3>
                <p class="text-xs text-slate-500 truncate">Designer • São Paulo</p>
                <div class="flex gap-2 mt-2">
                    <button class="flex-1 py-1.5 bg-[#F0F2F5] text-slate-600 text-xs font-bold rounded-lg hover:bg-slate-200 transition-colors">Perfil</button>
                    <button class="py-1.5 px-3 bg-[#004aad]/10 text-[#004aad] text-xs font-bold rounded-lg hover:bg-[#004aad]/20 transition-colors">
                        <i data-lucide="message-circle" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
