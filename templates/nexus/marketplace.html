{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-5xl mx-auto pb-20 pt-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-io-dark flex items-center gap-2">
            <i data-lucide="shopping-bag" class="w-6 h-6 text-pink-500"></i> Mercado
        </h1>
        <button class="px-4 py-2 bg-io-dark text-white rounded-xl text-sm font-bold shadow-lg hover:bg-black">+ Anunciar</button>
    </div>

    <div class="flex gap-2 overflow-x-auto pb-4 hide-scroll mb-2">
        <button class="px-5 py-2 bg-io-blue text-white rounded-full text-sm font-bold whitespace-nowrap">Tudo</button>
        <button class="px-5 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-io-blue">Cursos</button>
        <button class="px-5 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-io-blue">Serviços</button>
        <button class="px-5 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-io-blue">Produtos</button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        {% for i in "12345678" %}
        <div class="bg-white p-3 rounded-[1.5rem] shadow-sm hover:shadow-lg transition-all cursor-pointer group border border-gray-100">
            <div class="aspect-[4/5] rounded-xl bg-gray-200 overflow-hidden relative mb-3">
                <img src="https://source.unsplash.com/random/300x400?product,{{i}}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                <div class="absolute top-2 right-2 bg-white/90 backdrop-blur px-2 py-1 rounded-lg text-xs font-bold text-io-dark">R$ 150</div>
            </div>
            <h3 class="font-bold text-gray-900 text-sm truncate">Nome do Produto Incrível</h3>
            <p class="text-xs text-gray-500 mb-3">São Paulo, SP</p>
            <button class="w-full py-2 bg-slate-50 text-io-blue text-xs font-bold rounded-lg hover:bg-io-blue hover:text-white transition-colors">Ver Detalhes</button>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
