{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-2xl mx-auto pt-6 pb-24">
    
    <div class="mb-6 px-2">
        <h2 class="text-xl font-bold text-gray-800 flex items-center gap-3 mb-1">
            <i class="fa-regular fa-bell text-[#004aad]"></i> Notificações
        </h2>
        <p class="text-gray-500 text-sm">Fique por dentro das novidades</p>
    </div>

    <!-- Abas -->
    <div class="flex gap-3 mb-6 overflow-x-auto hide-scroll pb-2 px-2">
        <button class="px-5 py-2 rounded-full bg-[#004aad] text-white font-medium text-sm shadow-md border border-[#004aad]">Todas (0)</button>
        <button class="px-5 py-2 rounded-full bg-white text-gray-500 font-medium text-sm border border-gray-200 hover:bg-gray-50 transition-colors">Não lidas (0)</button>
        <button class="px-5 py-2 rounded-full bg-white text-gray-500 font-medium text-sm border border-gray-200 hover:bg-gray-50 transition-colors">Mentions</button>
    </div>

    <!-- Lista -->
    <div class="bg-white rounded-2xl p-12 text-center border border-gray-200 shadow-[0_4px_15px_rgba(0,0,0,0.03)] flex flex-col items-center mx-2">
        <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-300">
            <i class="fa-regular fa-bell-slash text-3xl"></i>
        </div>
        <h3 class="font-bold text-gray-800 text-lg mb-2">Tudo limpo por aqui</h3>
        <p class="text-gray-500 text-sm max-w-xs">Você leu todas as suas notificações. Volte mais tarde!</p>
    </div>

</div>
{% endblock %}
